# 编全平台全架构，然后发出去。
#
# **两条道，走哪条由推的是什么决定：**
#
#   打 tag（v 开头）  → 正式 Release，tag 就是版本号
#                        git tag v1.2.0 && git push origin v1.2.0
#   推任意分支        → 滚动预发布，**永远发在同一个 `beta` tag 上**
#   手动跑            → 同上，也发 beta
#
# beta 那条是"最后一次推的分支说了算"：每次把 `beta` 这个 Release 连同
# tag 删掉重建，指到这次的提交。所以上面永远只有一套包，不会攒下
# 半年前某个分支留的产物——**旧产物混在里面比没有更糟**，
# 下载的人分不出哪个是新的。
#
# `beta` 是预发布，所以 `/releases/latest` 不会指到它，install.sh 默认
# 装的仍然是正式版。想装 beta：`CHANGJI_VERSION=beta bash install.sh`。
#
# 六个格子的对应关系：
#
#   linux-x64     ubuntu-22.04       用 22.04 不用 24.04：glibc 2.35 而不是 2.39，
#                                    编出来的二进制往老一点的发行版上拷得动
#   linux-arm64   ubuntu-22.04-arm   同上。树莓派、ARM 服务器、Apple 上的 Linux 虚拟机
#   macos-arm64   macos-15
#   macos-x64     macos-15-intel     Intel Mac。macos-13 那批已经退役
#   windows-x64   windows-2022
#   windows-arm64 windows-11-arm     原生 arm64 跑 MSVC，不是交叉编译
#
# 换 runner 标签就改矩阵里那一行，别的地方不用动。
#
# ⚠️ **每推一次分支就是六个平台各编一遍 sd.cpp + llama.cpp**，一轮几十分钟。
# 只改文档也照编。嫌费的话在 on.push 底下加 paths-ignore。

name: 发布

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

# 同一个分支上连推两次，把上一次没跑完的取消掉——beta 上只留最后一次的
# 结果，早一次跑完也是白跑。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- 这一趟是什么 ----
  #
  # 版本号和发布方式在一处算完，后面几个 job 只管取。
  # 分散在各处用 `if: startsWith(github.ref, ...)` 判的话，改一次要改四处，
  # 漏一处的表现是"编出来的二进制版本号对，发布的地方不对"。
  meta:
    name: 这一趟发到哪
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}"  >> "$GITHUB_OUTPUT"
            echo "channel=release"             >> "$GITHUB_OUTPUT"
          else
            # 分支名里的 / 换成 -：它会进 `changji --version` 的输出，
            # 也会进文件名一类的地方，带斜杠迟早咬人。
            echo "version=beta-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # ---- 前端 ----
  #
  # **前端只编一次，六个格子共用。**
  #
  # 打包好的 dist 是嵌进二进制的（cpp/src/http/bundled_webapp.inc.hpp），
  # 那个文件进了版本库，所以不重新生成也编得过——**但那样发出去的界面
  # 可能是上一次有人记得跑 gen_webapp.py 时的样子**。表现是"打开是旧界面"，
  # 而版本号、接口、二进制全是新的，没有任何地方会报错。
  #
  # 所以这里重新 build 一次再嵌，产物当 artifact 传给六个构建格子。
  webapp:
    name: 前端（打包 + 嵌进头文件）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: changji/webapp/package-lock.json

      - name: 装依赖
        working-directory: changji/webapp
        run: npm ci

      # 前端的测试放在这儿跑：它是唯一会碰前端的格子，而且比六个 C++
      # 构建快得多——前端坏了不该等半小时才知道。
      - name: 测试
        working-directory: changji/webapp
        run: npm test

      # client 的 build 脚本是 `eslint src && vite build`，lint 不过就不出包。
      - name: 打包
        working-directory: changji/webapp
        run: npm run build

      - name: 嵌进头文件
        run: python3 changji/cpp/tools/gen_webapp.py

      - uses: actions/upload-artifact@v4
        with:
          name: bundled-webapp
          path: changji/cpp/src/http/bundled_webapp.inc.hpp
          retention-days: 1

  # ---- 单元测试 ----
  #
  # **不链 sd.cpp / llama.cpp**：这一档要的是快，几分钟出结论。
  # 那两个库编一次几十分钟，而单元测试目标本来就不链它们
  # （测的是没编进来时的那一支存根）。
  #
  # 两个平台都跑：路径那一层按平台分支，`user_dirs.json` 里
  # macos / linux / windows 各存一份，只在 Linux 上跑的话 macOS 那份
  # 永远没人验。Windows 那格由下面的构建覆盖（编得过就说明没写坏）。
  test:
    name: 单元测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: 装 ninja
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build
          else
            brew install ninja
          fi

      - name: 配置
        run: |
          cmake -S changji/cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHANGJI_SD=OFF \
            -DCHANGJI_LLAMA=OFF \
            -DCHANGJI_BUILD_TESTS=ON

      - name: 编
        run: cmake --build build --target changji_tests --parallel

      - name: 跑
        run: ctest --test-dir build --output-on-failure

  # ---- 六个平台 ----
  build:
    name: 编 ${{ matrix.target }}
    needs: [meta, webapp, test]
    runs-on: ${{ matrix.runner }}
    env:
      # 写进二进制，`changji --version` 打印它——报故障时第一句话就是这个。
      # 正式版是 tag，beta 是 `beta-<分支>-<短 sha>`，一眼看得出是哪一条。
      CHANGJI_VERSION: ${{ needs.meta.outputs.version }}
    strategy:
      # 一格挂掉不连累别的格子：六个平台各有各的坑，一次看全比修一个
      # 再等一轮省事。
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
          - target: windows-x64
            runner: windows-2022
            arch: x64
          - target: windows-arm64
            runner: windows-11-arm
            arch: ARM64
    steps:
      - uses: actions/checkout@v4

      # CHANGJI_LLAMA=ON 要一个 Python：llama.cpp 拉下来要就地打 leejet 的
      # 扩展补丁（patches/apply_to_llamacpp.py），配置期找不到解释器会当场停。
      # 各个 runner 自带的 python 版本不一样，钉一个免得哪天镜像换了才发现。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: bundled-webapp
          path: changji/cpp/src/http/

      - name: 装 ninja（Unix）
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build
          else
            brew install ninja
          fi

      # **GGML_NATIVE=OFF 是这里最要紧的一个开关。**
      #
      # ggml 默认开着它，也就是 -march=native：编出来的二进制带着**构建机
      # 那颗 CPU** 的指令集。发布包这么编的话，用户机器老一点就
      # SIGILL / "非法指令" 闪退，而那个报错和"这个程序有 bug"看着一模一样。
      # 关掉之后 x86 走 AVX2 基线（2013 年的 Haswell 起），arm64 走通用 armv8。
      #
      # macOS 上顺带钉两样：
      #   - 部署目标 13.3，不跟着 runner 的系统版本走。不钉的话编出来的东西
      #     要 macOS 15 才肯跑，而买 Intel Mac 的人多半没升到 15。
      #   - Metal 着色器嵌进二进制。不嵌的话运行时要在旁边找 .metallib，
      #     "单文件"就不成立了。
      - name: 配置（Unix）
        if: runner.os != 'Windows'
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA="-DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DGGML_METAL_EMBED_LIBRARY=ON"
          fi
          cmake -S changji/cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHANGJI_VERSION="$CHANGJI_VERSION" \
            -DCHANGJI_SD=ON \
            -DCHANGJI_LLAMA=ON \
            -DCHANGJI_BUILD_TESTS=OFF \
            -DGGML_NATIVE=OFF \
            $EXTRA

      # **Windows 上用 Visual Studio 生成器，不是 Ninja。**
      # Ninja 那条要先 call vcvarsall.bat，而两台 Windows runner 的
      # VS 装在哪、装了哪个组件不完全一样。VS 生成器自己去找工具链，
      # 一行参数管两个架构，少一类"只在 arm64 那格挂"的故障。
      - name: 配置（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S changji/cpp -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} `
            -DCHANGJI_VERSION="$env:CHANGJI_VERSION" `
            -DCHANGJI_SD=ON `
            -DCHANGJI_LLAMA=ON `
            -DCHANGJI_BUILD_TESTS=OFF `
            -DGGML_NATIVE=OFF

      # 只编 changji 这一个目标。测试目标已经在上面那一档跑过了，
      # 这里再编一遍是白等几十分钟。
      - name: 编
        run: cmake --build build --config Release --target changji --parallel

      # 编出来的东西到底是不是能跑的，在这儿花一秒钟问一句。
      # 交叉编译、静态链接、Metal 嵌入这几样出问题时，产物看着都正常，
      # 只有跑一下才知道。arm64 那两格是原生 runner，所以跑得起来。
      - name: 验一下它能起来（Unix）
        if: runner.os != 'Windows'
        run: |
          ./build/changji --version
          test "$(./build/changji --version)" = "$CHANGJI_VERSION"

      - name: 验一下它能起来（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = & build/Release/changji.exe --version
          Write-Host $v
          if ($v -ne $env:CHANGJI_VERSION) { throw "版本号对不上：$v" }

      - name: 打包（Unix）
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist stage
          cp build/changji stage/
          cp changji/README.md stage/
          tar -czf "dist/changji-${{ matrix.target }}.tar.gz" -C stage .

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item build/Release/changji.exe stage/
          Copy-Item changji/README.md stage/
          Compress-Archive -Path stage/* -DestinationPath "dist/changji-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: changji-${{ matrix.target }}
          path: dist/*

  # ---- 发布 ----
  publish:
    name: 发到 ${{ needs.meta.outputs.channel == 'release' && 'Release' || 'beta 预发布' }}
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # **不按 ref 分组，按渠道分组，而且不取消。**
    # 两个分支同时推的话，两趟都要往同一个 beta 上发；取消或者并发跑
    # 都可能撞在"删掉旧的、还没建新的"那个空档上，那时候 beta 是不存在的。
    # 排队让它们一个一个来，最后一个跑完的说了算。
    concurrency:
      group: publish-${{ needs.meta.outputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: changji-*
          path: dist
          merge-multiple: true

      # **校验和要出。** install.sh 会下这份来对，对不上就不装——
      # 半路断掉的下载装上去的表现是"Exec format error"，
      # 那个报错和网络问题看不出关系。
      - name: 算 SHA256SUMS
        working-directory: dist
        run: |
          sha256sum changji-* | tee SHA256SUMS
          ls -lh

      - name: 写发布说明
        run: |
          cat > notes.md <<'EOF'
          | 系统 | 架构 | 包 |
          |---|---|---|
          | Linux | x64 | `changji-linux-x64.tar.gz` |
          | Linux | arm64 | `changji-linux-arm64.tar.gz` |
          | macOS | Apple 芯片 | `changji-macos-arm64.tar.gz` |
          | macOS | Intel | `changji-macos-x64.tar.gz` |
          | Windows | x64 | `changji-windows-x64.zip` |
          | Windows | arm64 | `changji-windows-arm64.zip` |

          解开就是一个可执行文件，没有运行时依赖。**装配和字幕烧录要
          ffmpeg**，系统 PATH 里有就行。模型权重不在包里，第一次打开界面
          会让你选，选完它自己下。

          ```
          changji --version       手上这个是哪一版
          changji --doctor        体检，缺什么它会说
          changji --port 8080     起服务，浏览器打开 http://127.0.0.1:8080
          ```

          `SHA256SUMS` 是这些包的校验和。
          EOF

      - name: 建 Release（正式版）
        if: needs.meta.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## 下载"
            echo
            cat notes.md
            echo
            echo "Linux / macOS 上也可以一条命令装："
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/changji/install.sh | bash"
            echo '```'
            echo
            echo "---"
          } > body.md
          gh release create "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ github.ref_name }}" \
            --notes-file body.md \
            --generate-notes \
            dist/*

      # **beta 是删掉重建，不是往上加。**
      #
      # 往上加（`gh release upload --clobber`）看着更温和，但有两处不对：
      # tag 会一直钉在第一次建它的那个提交上（`gh release edit --target`
      # 只对草稿有效），而某个平台这一趟没编出来时，上面还留着**上一趟
      # 那个平台的包**——下载的人分不出哪个是新的，而且那正是他最需要
      # 分清的时候。
      #
      # 空档期的代价是几秒钟内 beta 不存在，比发出去一套新旧混装的包轻。
      - name: 建 beta 预发布
        if: needs.meta.outputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
            || echo "没有旧的 beta Release，跳过"
          # 兜底：上一步只在"Release 存在"时才会顺手删 tag。
          # 光有 tag 没有 Release 的话（手工打过、或者上一趟半路挂了），
          # 下面的 create 会沿用那个旧 tag，**发出来的东西指着旧提交**。
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/beta" --silent \
            || echo "没有残留的 beta tag，跳过"
          {
            echo "**滚动预发布。** 最后一次推分支编出来的，随时会被下一次盖掉。"
            echo "要稳定版去 [Releases](https://github.com/$GITHUB_REPOSITORY/releases) 里找 v 开头的。"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 分支 | \`${GITHUB_REF_NAME}\` |"
            echo "| 提交 | ${GITHUB_SHA} |"
            echo "| 版本号 | \`${{ needs.meta.outputs.version }}\`（\`changji --version\` 打印这个） |"
            echo "| 编于 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo
            echo "## 下载"
            echo
            cat notes.md
            echo
            echo "装 beta："
            echo
            echo '```bash'
            echo "CHANGJI_VERSION=beta bash <(curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/changji/install.sh)"
            echo '```'
          } > body.md
          gh release create beta \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "beta（${GITHUB_REF_NAME}）" \
            --notes-file body.md \
            dist/*
