# 场记的提示词，全在这一份里。
#
# **这是出处，改提示词就改这儿。** 构建时 cpp/tools/gen_prompts.py 把它生成成
# build/generated/stages/prompts.inc.hpp（不进版本库），C++ 里按
# `prompt::<表>::k<键>` 引用：[script] 的 seg0 就是 prompt::script::kSeg0，
# hint_realistic 就是 kHintRealistic。改完重新 cmake --build 就生效，
# 不用手跑任何脚本——prompts.toml 是构建的依赖之一。
#
# ---- 目录：哪张表管哪一步 ----
#
# **表名 = 用它的 src/stages/ 文件名**：chapter_write.cpp 用 [chapter_write]，
# storyboard.cpp 用 [storyboard]。找某一步的提示词，按文件名找表。
#
# 一、故事线（先有一部完整的故事，再一集一集拍）—— 故事页
#   [story_outline]   从一句梗概 / 几个关键词 / 什么都没有，写出整个故事的大纲
#                     POST /api/story/outline
#   [chapter_write]   **写正文**：把大纲里的一章展开成几场戏的小说正文，
#                     每一场的收口就是一集的结尾
#                     POST /api/story/chapter（一章）、/api/story/chapters（全部）
#   [story_analyze]   用户粘进来现成的正文时，读一遍提出人物、关系、地点和钩子
#                     POST /api/story/analyze（故事页「提人物」）
#   [story_revise]    改稿：只改作者圈出来的那一段
#                     POST /api/story/revise
#   [bible_story]     照着故事的人物表、场景表定妆（角色圣经）
#                     POST /api/bible，项目里有故事时走这份
#   [script_story]    照着故事里定好的一集，写成能拍的剧本
#                     POST /api/script/write，这一集在分集表里时走这份
#
# 二、逐集线（没有故事，直接一集一集续写的老路径）—— 剧集页 / 单集页
#   [script_premise]  选题：给几个方向的方案            POST /api/script/premise
#   [script]          逐集写剧本：一句梗概 + 前几集原文  POST /api/script/write
#   [script_trailer]  预告片                             POST /api/script/trailer（「剪一条」）
#   [bible]           从一集剧本里找出角色和场景并定妆   POST /api/bible，没有故事时走这份
#
# 三、剧本之后，两条线共用
#   [storyboard]      把一集剧本拆成分镜表
#                     POST /api/plan、/api/plan/all（「批量补分镜」）
#   [ref_images]      角色三视图 / 场景空景的参考图提示词，喂出图模型
#                     POST /api/character/reference/generate、/api/location/reference/generate
#   [style]           默认画风、默认负向词：项目没填时补上，出图出片每一镜都带
#   [compose]         景别 / 机位 / 运镜的词表，拼进每一镜的首帧和运动提示词
#                     stages/prompt_compose.cpp
#
# 四、所有走 JSON Schema 的大模型请求共用
#   [llm]             贴在提示词末尾、schema 前面的那句话（llm/client.cpp 的 schema_as_prompt）
#
# 五、不生成命名空间的两张表
#   [shared]          同一句话在好几张表里出现时写在这儿，别处用 {{shared.键}}
#                     引用，构建时原地展开（见那张表上面的说明）
#   [story_outline_spark]  按种子抽的姓氏池和选题空间——它生成命名空间，
#                     但没有哪一步"属于"它，两条写故事的路都从里面抽
#
# ---- 格式 ----
#
# TOML 的一个子集（gen_prompts.py 开头列了认哪些东西）：
#   · 三引号 """ 是多行字符串，**开头紧跟的那个换行不算内容**，所以每条
#     从三引号的下一行开始写；结尾的三引号紧贴最后一个字，那个字后面的
#     空格和空行都是内容。好几条段落故意以空格或空行结尾（后面要接数字
#     或下一段），别"顺手清理"。
#   · 数字是截断长度、比例这类和提示词一起调的旋钮，生成成 std::size_t / double。
#   · 字符串数组生成成 const char* 数组。
#   · [compose.*] 那几张二级表是出图提示词里的词表，键是枚举名。
#   · {{shared.键}} 在生成期展开成 [shared] 表里那段文字，[shared] 自己
#     不生成命名空间。
#
# ---- 哪些能随便改、哪些不能 ----
#
#   [bible] [script] [script_premise] [script_trailer] [storyboard] [style] [compose]
#   这几张是从已经删掉的 Python 引擎逐字节搬过来的，tests/golden 里有对拍
#   语料钉着——改一个字对应的单元测试就红，那是有意的（提示词是喂给模型的
#   输入，差一个空格出的东西就不一样）。改了就把语料一起改。
#   其余的表是 C++ 时代新写的，没有对拍语料，该调就调。
#
#   2026-09-14 第一次动了锁定的表：[script] 的第 8/9/10 条、[bible] 的第
#   5/6 条，语料已经一起改。动的都是**举例子的那半句**，规则本身一个字没变。
#   原因见下面「别在提示词里举具体的例子」那段。
#
# 每张表开头的注释说的是这张表拼成一条提示词的顺序，「画风」「时长」这类
# 是运行时插进去的值，[方括号] 里的是有条件才出现的块。
#
# ---- 别在提示词里举具体的例子（2026-09-14 清过一轮）----
#
# 用户的判词是「每次写文章的内容都差不多，角色的名字也都差不多」。查下来
# 有一半是这份文件自己喂的：**举例子的那半句会被当成素材原样抄进故事里。**
# 清掉之前，同一个名词在好几张表里反复出现，于是在成片里也反复出现——
#
#     「一枚缺了角的铜钱」   3 处（chapter_write / script_story / script）
#     「深夜，天台，只有应急灯」 2 处
#     「她把茶杯重重放下」   2 处
#     「高架桥下那家通宵咖啡馆」
#     「夜间冷调顶光，霓虹反光」 2 处
#     key 的例子 lin_wan     2 处（还有一处在 stages/bible.cpp 的 schema 里）
#
# 最后那个就是「林晚」。它本来只是教模型 key 怎么拼写，结果连人名一起教了。
#
# 规矩是**反例留着，正例删掉**：
#
#     「不说「一件信物」」        ← 留。它是禁令，模型照抄它等于违规。
#     「说「一枚缺了角的铜钱」」  ← 删。它是答案，模型照抄它等于照做。
#
# 正例的位置换成**配方**——写出材质、尺寸、磨损；写出时间、地点、光。
# 要求一点没松，只是不再替它想好写什么。
#
# 所以：**这份文件里任何一个具体的名词、人名、地名，都要先问一句
# 「模型把它原样抄走，我认不认」。** 不认就别写在这儿。


# ==========================================================================
# 一、故事线：先有一部完整的故事，再一集一集拍（故事页）
# ==========================================================================


# 故事大纲的提示词。
#
# 和 [script] / [bible] 那几个不一样：那些是从已经删掉的 Python
# 引擎移植过来的，要求逐字节一致（有对拍语料钉着）。这一份是新写的，
# 没有 Python 对应物，**不受逐字节约束**，该调就调。
#
# 拼接顺序：
#   seg0 + 画风 + seg1 + 章数 + seg2 + rules
#        + [keywords_pre + 关键词 + keywords_post]
#        + tail_head + 梗概 + tail_end（没给梗概时 tail_head + 梗概 换成 no_premise）
# ==========================================================================
# 共用段：同一句话在好几张表里出现
# ==========================================================================
#
# **写在这儿，别在每张表里各抄一遍。** 「只输出 JSON，不要任何解释文字。」
# 原来有九处，画风那两句各四处——改一处忘了另外两处，出来的东西不一致，
# 而**没有任何地方会报错**：提示词差一句话，模型只是写得不一样，接口照样
# 返回 200。
#
# 用法：在别的表里写 {{shared.键}}，构建时原地展开。换行留在引用的地方、
# 不放进共用段——那是**排版**，每张表前面接什么各不相同；共用的是**那句话**。
#
# 三条规矩，违反了 gen_prompts.py 当场报错（都是"静默出错"的防线）：
#   · 共用段里不能再引用共用段——一层就够，两层之后要跳三个地方才看得出
#     这句话长什么样；
#   · 引用不存在的键报错——写错一个字的话，那串花括号会原样留在提示词里，
#     模型把它当正文读；
#   · 定义了没人用的键也报错——多半是改名时漏了一处，而留着的那份会让下
#     一个人以为它还在生效。
#
# ⚠️ **展开之后生成出来的头一个字节都没变**，这是有意的：[script] [bible]
# [storyboard] 那几张表被逐字节对拍的语料钉着，"顺手整理一下"不该让那几条
# 用例变红。要真改提示词，改完把语料一起改——那是另一回事。

[shared]

json_only = "只输出 JSON，不要任何解释文字。"

hint_realistic = "真人写实短剧"

hint_anime = "动漫短剧"

reuse_characters = "必须沿用这些已有角色，名字一字不改："

keywords_pre = "往这个方向想："

# 分镜的硬性要求第 2 条起。**整集一次拆**（[storyboard]）和**按场拆**
# （[storyboard_scene]）共用；前者是逐字节对拍的，改这里要连语料一起改。
# 第 1 条（shot_id 的写法）留在各自的表里，它中间要插剧集 id。
#
# ⚠️ **第 4 条末尾那句「换装只能通过 wardrobe_state 填一个状态名」，
# 今天写了等于没写。** 那个状态名要能对上 `Character::wardrobe` 里的一条
# `WardrobeVariant`，而**没有任何一处会创建它**：定妆那一步不产（[bible]
# 那边反过来还叮嘱「剧情中的换装不在这里写」）、`/api/character` 的白名单
# 里没有 wardrobe、界面上一个字都没有。对不上的时候
# `Character::wardrobe_desc()` 一声不吭退回 `appearance.attire`
# （models/character.cpp），于是模型认认真真填的 suit_torn / 雨中，出来
# 的每一帧穿的都是那身干净的常服，中间没有任何地方会提一句。
#
# 这一句先留着：改它要连 stage_storyboard 那份逐字节语料一起动，而真正
# 缺的那一环也不在这儿——要补的是"谁来创建 WardrobeVariant"。
storyboard_rules = """
2. order 从 0 开始递增。
3. duration_s 只能取配额里出现过的值，且各档位的数量必须与配额完全一致。
4. characters 必须填。凡是这一镜里出现的人，都要在这里列出 char_id，
   并填本镜的表情、动作、面部朝向。画面里没有人才填空数组。
   只填这些，绝对不要描述角色的长相、发型、发色、身材或服装样式，
   那些由系统统一管理，你写了会被丢弃并造成前后不一致。
   换装只能通过 wardrobe_state 填一个状态名。
5. first_frame_prompt 描述这一镜的画面：环境、构图、角色的姿态和位置。
   同样不要描述角色长相，系统会自动拼接。
6. motion_prompt 必须填，按秒分段写这几秒里画面怎么动，格式是
   「[0-2秒] …… [2-5秒] ……」，每段一两句，段要连起来盖满整镜的时长。
   每段写：谁在动、朝哪个方向动、快还是慢；镜头怎么动要写名字、幅度和速度，
   不要只写一个动词。画面里除了人还有什么在动（天气、烟尘、水、火光、布料、
   头发），有就一起写上；会响的东西（雨、车流、门、脚步）用画面写出来，
   视频模型会照着出声，不要单独写音效。
   这一栏是决定画面动不动的唯一依据：first_frame_prompt 只定住第一帧，
   长相、服装、场景也都已经定死了，这里不要再复述它们，也不要写剪辑用语。
   **只能写第一帧里已经看得见的东西怎么动。** 出片模型是照着第一帧往下演的，
   写了画面里没有的东西，它只能自己编，编出来的就是崩掉的那一段：
   · 不要写人或物**进画、出画**（走进来、闯入、走出去、离开画面）——
     画面外的人它得凭空造。要表现「有人进来」，就把**人已经在门里**的
     那一刻当第一帧，运动只写他继续往前走两步。
   · 不要写**开门、开窗、拉开抽屉**这种会露出第一帧看不见的空间的动作——
     门后有什么它不知道，会自己编一个。实测一个三秒镜头：首帧是人推门，
     三秒后门后凭空多出一间楼梯间，人整个不见了，只剩一只手和文件袋悬着。
     门必须开的话，把门开着、门后的样子也写进第一帧。
   · 不要写**镜头穿过**门框、窗户、走廊拐角去看另一边。
   · 一镜只演一件事。「门打开 + 人走进来 + 文件袋晃动 + 另一个人抬头」
     是四件事，三秒钟演不完，模型会挑着演、剩下的自己编。
7. camera_move 必须按这一镜真正需要的运镜挑，不要整集都用同一个：
   推进情绪用 push_in，交代环境用 pull_out 或 pan_left / pan_right，
   跟着人走用 handheld，绕着看用 orbit。
   只有定格的物件特写或静止的空镜才填 static。
8. camera_angle 必须按这一镜的情绪挑：压迫用 low，脆弱用 high，
   失衡用 dutch，交代全局用 overhead；eye_level 只给平静的对话。
9. lens 必须填：交代环境和空间用 wide，对话和日常用 normal，
   脸的特写和情绪用 portrait，远处的人和压扁的背景用 tele。
10. lighting 必须填，写这一镜的光，一句话四样都要有：什么时段、光从哪儿来、
    朝哪个方向打、硬还是软。
11. dialogue 必须填。剧本里的每一句台词都要落到某个镜头上，一句都不能丢。
    说话的人填 char_id，旁白留空。这一镜没人说话才填空数组。
    说话的角色也必须同时出现在 characters 里。
12. 同一场景内连续镜头尽量复用 camera_id，避免越轴。
13. 紧接上一镜动作的镜头（同一场景、同一时刻、动作连着）把
    continuous_with_prev 填 true，出片时会拿上一镜的最后一帧接着拍。
    只有这一镜必须落在一个明确的画面上时才填 last_frame_prompt
    （比如推到某个物件上停住），否则留空。
14. shot_size 必须有节奏，**整场不能只用一种**——那不叫分镜，那叫一张图
    重复十遍。
    ⚠️ **画面里有人的时候，这一栏对出图的影响很有限**：首帧走的是图像
    编辑模型，它照着角色定妆图的取景走（定妆图是全身站姿，出来多半也是
    全身），景别那两个字压不过一张图。所以**要拉开景别，靠的是换内容不是
    换标签**：想要大景就写环境、写空镜；想要特写就让这一镜只剩一个局部
    （手、证件、杯子），别写成「某人的特写」——写成人，出来的就还是人。
    按这个比例分：
    · 每一场的**第一镜**用 LS 或 MLS 交代这是哪儿、人在哪个位置。
      观众不知道人站在哪儿的时候，后面所有的特写都是悬空的。
    · 叙事和对话的主力是 MS / MCU，占一半左右。
    · CU / ECU 只给情绪爆发、要看清眼神和手的那一两个瞬间，
      整场合起来不超过三成。**大特写是标点，不是正文。**
      ECU 这一档系统不会拼角色长相和场景（那一档画面里只装得下一个局部），
      所以填 ECU 时 first_frame_prompt 要自己点名这是谁的手、谁的眼、
      什么物件——写不出具体是哪个局部，就说明这一镜不该是 ECU。
    · 冲突过去之后拉回 MLS / LS 把情绪放掉，再进下一场。
    正脸的长台词拆成「正脸起句 + 切到听的人的反应」两镜，
    别让一个人对着镜头说满五秒。
15. **不是每一镜都得有人。每五镜里至少要有一个空镜**（characters 填空
    数组，画面里一个人都没有），一场至少一个，全集不少于五分之一。
    门缝里的光、桌上凉掉的茶、窗外的雨、走廊尽头、散落一地的文件、
    墙上的钟、风里的窗帘、地上的烟头。
    空镜交代时间过去、地点转换和情绪留白——它是成片和幻灯片的区别。
    空镜的 shot_size 用 LS / MLS（环境）或 CU（物件），
    camera_move 可以填 static，dialogue 填空数组（旁白除外）。
    **写空镜时把画面写死在那一个东西上**：写「桌上一只凉掉的茶杯，杯壁
    挂着水珠，背后的屋子虚掉」，不要写「办公室里很安静」——前者出得来，
    后者出来还是一张大全景。
    （2026-09-16 实测：一集十九镜只有两镜空镜，而那两镜恰恰是全集里
    景别最准的两镜——画面里有人的时候，出图模型照着人物定妆图的取景走，
    分镜写的景别基本不起作用；没有人的镜头才真正听画面描述的。）
16. transition_in 默认 cut 且 transition_dur_s 必须为 0；
    只有场景切换才用 dissolve，此时 transition_dur_s 填 0.4。
17. continuity_notes 记录需要与前后镜保持一致的细节，比如道具在哪只手。
18. 如果剧本里有信息不足以确定画面的地方，写进 missing_info，不要自己编。
19. **画面里不要出现可读的文字**：招牌、屏幕上的字、文件上的字、字幕。
    视频模型一秒一个样地改写它们——实测一个写着「0元」的屏幕，
    五秒里变成「另元」再变成「2元」。要表达「余额是零」，
    写人的反应，不要写屏幕上的数字。
"""


[story_outline]

seg0 = "你在给一部竖屏"

hint_realistic = "{{shared.hint_realistic}}"

hint_anime = "{{shared.hint_anime}}"

seg1 = "写故事大纲。整个故事写成 "

seg2 = """
 章左右。

硬性要求：
"""

rules = """
1. 这是一个**有结尾的完整故事**，不是一个能一直往下拍的设定。
   最后一章要把主线了结，不要留「待续」。
2. 章数按故事本身的需要来。上面那个数只是量级，多一两章少一两章都行，
   但不要为了凑数注水，也不要硬收。
3. 每一章只推进一件事。一章里塞三条线，后面按时长切集时切不开。
   但**一章是一个完整的故事单元，不是一句话**：它后面要展开成几千字正文，
   再按每集时长切成好几集。所以 summary 要写清这一章从哪儿开始、中间
   发生什么、到哪儿为止，撑得起这个体量。
   **每一章都要把故事往前挪一步**：换了地方、过了一段时间，或者局面变了。
   下一章从上一章停下的地方接着走，不回头把同一个场面换个角度再演一遍——
   三章都写「门铃响、她拿着伞进来」，等于只写了一章。
4. **每一章都要抖出一件新的事，而且它要推翻前面的认知**（reveal 那一栏）。
   四种里挑一种：谁其实是谁（身份）、两人其实是什么关系、当年那件事其实
   不是大家以为的那样（事实）、他当初那么做其实是为了什么（动机）。
   「又见了一面」「又谈了一次」「他解释了一遍」不算——那是推进，不是反转。
   一章抖一件，后面几章抖的要比前面那件更狠，不能四章都在抖同一件事的
   不同说法。
   **最后一章抖的那件事要能了结主线**，前面几章抖的都是通向它的台阶。
   每一章还要**埋下**一样后面才回收的东西（plant 那一栏）：一个物件、
   一句没头没尾的话、一个当时说不通的细节。埋的时候不解释，读者当时
   看不出它要紧。**最后一章回收前面埋的某一样**——观众要的不是被吓一跳，
   是「原来如此」。凭空冒出来的反转不算数。
5. 每一章的 hook 是**这一章结束时悬着的那件事**：一个悬念、一个反转，
   或者一个明确的情绪落点。后面每一集的结尾都要落在这种位置上，
   所以每章都必须有，不能空着。
   **写成能直接当这一章最后一句的正文**：一句台词、一个动作，或者一样
   被看见的东西。不是向读者提问，不是「他们能否走到一起？」这种梗概腔，
   也不要写「故事完结」「无续集」这类说明——正文那一步会把它照抄进去。
6. 主要人物不超过三个。短剧里人一多就立不住。配角只写真的有戏的。
7. **不要写任何长相、发型、服装、身材。** 人物长什么样由后面的美术那一步
   统一定，这里写了两边必然不一致，而不一致会一路带到每一个镜头上。
   这里只写他是谁、他要什么、他怎么变。
8. 每一组有戏的关系都要写进 relations，并且说清那段关系里绷着的是什么。
   只写「前任」不够，要写成「谁欠谁一句没说出口的道歉」。
9. want 是这个人物**主动要的东西**。没有欲望的人物推不动情节，
   写「希望生活变好」这种等于没写。
10. 地点要具体到看得见：「一家咖啡馆」这种类目名不算数。说清它在这座城
   什么位置、什么时候开着、推门进去先看见什么，写成只可能是这一处的样子。
   后面每一镜都要照着它画，含糊的地方每镜长得都不一样。
11. 人物名前后一模一样，不要一会儿全名一会儿简称。

"""

