[style]

# 2026-09-14 改成配方（docs/电影质感方案.md）：不写「电影感」这三个字——
# 它没有信息量；写胶片质感、焦段倾向和景深、色板、光的性格四样。
default_realistic = "实拍电影画面，35mm 胶片质感，细腻颗粒，高光柔和不过曝，中长焦，浅景深，低饱和冷暖对比，皮肤有真实纹理，光线有明确来处，暗部占大半"

default_anime = "日系二维动画，赛璐璐上色，干净线条，平涂阴影"

# ⚠️ **写实线这儿不加"压卡通"。** 试过加一句
# 「3D 渲染，卡通，动画，插画，CG 质感」——治的是同一个病（没有画风词
# 时模型爱往 3D 卡通跑），但这串字是和 Python 逐字节对拍的接口输出，
