#       + 四段（act_block_head + 每段一行 + act_block_tail，见 render_act_brief）
#       + [chars_pre + 角色名 + chars_post]
#       + [prev_pre + 前情 + prev_post]
#       + tail_head + 梗概 + tail_end
# 选题（[script_premise]）：seg0 + 画风 + seg1 + 数量 + rules
#       + [keywords_pre + 关键词 + keywords_post]
#       + [existing_pre + 已有方向 + existing_post]
#       + tail_end
# 预告片（[script_trailer]）：seg0 + 画风 + seg1 + 时长 + seg2 + 字数 + rules
#         + [chars_pre + 角色名 + chars_post]
#         + [episodes_pre + 已写剧集 + episodes_post]
#         + tail_head + 梗概 + tail_end
[script]
seg0 = "你在写一集竖屏短剧，总时长约 "

hint_realistic = "真人写实短剧，台词生活化，不要文绉绉的书面语"

hint_anime = "动漫短剧，台词可以更有戏剧张力，但仍要口语化"

seg1 = " 秒。"

seg2 = """
。

硬性要求：
1. 所有对白加起来控制在 """

rules = """
 个字左右，超出很多就是拍不完。
2. 动作和对白交替推进，不要连着好几句对白，画面会没有呼吸。
3. 出场角色不超过三个。人一多，短剧里根本立不住。
4. 对白只写说出口的话，不要带引号，不要在 text 里重复人名。
5. 同一个角色的名字前后必须一模一样，不要一会儿全名一会儿简称。
6. 开头三秒就要有事发生，短剧没有铺垫的余地。
7. 结尾留一个钩子或者一个明确的情绪落点。

动作那几拍要**拍得出来**。下一步要照着它画分镜，所以：
8. 换地方、换时间就在那一拍的开头交代清楚：在哪、什么时候、什么光。
   例如「深夜，天台，只有应急灯」。同一个地方连着几拍就不用重复。
9. 写角色**身体在做什么**，别写他心里怎么想。
   不要「她很生气」，要「她把茶杯重重放下，茶水溅到手背上」。
   情绪从动作和台词里透出来，写心理活动画不出来。
10. 提到的东西要具体到看得见：不说「一件信物」，说「一枚缺了角的铜钱」。
    后面每一镜都要拿它当道具，含糊的东西每镜长得都不一样。
11. 每一拍只写一件事。一拍里塞三个动作，分镜只能挑一个画，剩下的就丢了。

"""

# ---- 四段 ----
#
# 一集按秒排成四段，正片和从故事写的那条路共用。**这一段必须进提示词**，
# 光写在 schema 的 description 里模型看不见（GBNF 只有结构）。
# 每段那一行由 render_act_brief 拼：「  开场钩子（0–5 秒）：<brief>。至少 N 拍。」
act_keys = ["opening", "escalation", "payoff", "cliff"]
act_labels = ["开场钩子", "冲突推进", "情绪回报", "集尾留扣"]
act_briefs = [
    "一句冲突台词或一个反常画面，三秒内有事发生，不铺垫",
    "对立方步步紧逼，一步比一步紧，中途给一次小回报再压回去",
    "反击、打脸或真相——观众等的那一下",
    "在情绪最高或最意外处切断，最后一拍就是钩子",
]

act_block_head = """
这一集分四段，按秒排。JSON 里 opening、escalation、payoff、cliff 四项就是它们，顺序不能换：
"""

act_block_tail = """
一拍是一个动作或一句台词。四段加起来要撑满整集，每段的拍数照上面的下限往上写——写少了这一集就只有十几秒。

"""

chars_pre = "必须沿用这些已有角色，名字一字不改："

chars_post = """
。

"""

prev_pre = """
前面几集的剧本如下，这一集要接着往下写，人物关系和已经发生的事不能推翻：

"""

prev_post = """


"""

tail_head = """
这一集要写的：

"""

tail_end = """


只输出 JSON，不要任何解释文字。"""

# 一集里对白占的比重。剩下的是动作和环境描写，
# 不发声但占画面时长。全是对白的话成片像念稿子。
dialogue_share = 0.62

chars_per_second = 4.6

# 塞进提示词前要截断的长度，按**字符**不是字节。
prev_max_chars = 4000


# 预告片。拼接顺序见 [script] 开头。四段那一块预告片不带。
[script_trailer]

seg0 = "你在写一部竖屏"

hint_realistic = "真人写实"

hint_anime = "动漫"

seg1 = "短剧的预告片，总时长约 "

seg2 = """
 秒。

预告片不是把正片缩短，是另一种东西。硬性要求：
1. 所有对白加起来控制在 """

rules = """
 个字以内。预告片以画面为主，话越少越有劲。
2. 用蒙太奇：几个不相干的瞬间快速切换，不要讲一条完整的时间线。
3. 前两秒必须是全片最抓人的那个画面或那句话，刷到就得停下来。
4. 只给钩子，不给答案。关键情节点到为止，结局绝对不能剧透。
5. 结尾停在悬念上，可以是一句反问、一个未完成的动作或一个眼神。
6. 对白只写说出口的话，不要带引号，不要在 text 里重复人名。
7. 出场角色不超过三个，名字前后一模一样。
8. title 写这部剧的名字，logline 写一句能当封面文案的钩子。

"""

chars_pre = "必须沿用这些已有角色，名字一字不改："

chars_post = """
。

"""

episodes_pre = """
已经写好的剧集如下。从里面挑最有冲击力的瞬间来剪，不要编造剧里没有的情节，也不要把结局说出来：

"""

episodes_post = """


"""

tail_head = """
这部剧讲的是：

"""

tail_end = """


只输出 JSON，不要任何解释文字。"""

