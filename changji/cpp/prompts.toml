# 场记的提示词，全在这一份里。
#
# **这是出处，改提示词就改这儿。** 构建时 cpp/tools/gen_prompts.py 把它生成成
# build/generated/stages/prompts.inc.hpp（不进版本库），C++ 里按
# `prompt::<表>::k<键>` 引用：[script] 的 seg0 就是 prompt::script::kSeg0，
# hint_realistic 就是 kHintRealistic。改完重新 cmake --build 就生效，
# 不用手跑任何脚本——prompts.toml 是构建的依赖之一。
#
# ---- 目录：哪张表管哪一步 ----
#
# **表名 = 用它的 src/stages/ 文件名**：chapter_write.cpp 用 [chapter_write]，
# storyboard.cpp 用 [storyboard]。找某一步的提示词，按文件名找表。
#
# 一、故事线（先有一部完整的故事，再一集一集拍）—— 故事页
#   [story_outline]   从一句梗概 / 几个关键词 / 什么都没有，写出整个故事的大纲
#                     POST /api/story/outline
#   [chapter_write]   **写正文**：把大纲里的一章展开成几场戏的小说正文，
#                     每一场的收口就是一集的结尾
#                     POST /api/story/chapter（一章）、/api/story/chapters（全部）
#   [story_analyze]   用户粘进来现成的正文时，读一遍提出人物、关系、地点和钩子
#                     POST /api/story/analyze（故事页「提人物」）
#   [story_revise]    改稿：只改作者圈出来的那一段
#                     POST /api/story/revise
#   [bible_story]     照着故事的人物表、场景表定妆（角色圣经）
#                     POST /api/bible，项目里有故事时走这份
#   [script_story]    照着故事里定好的一集，写成能拍的剧本
#                     POST /api/script/write，这一集在分集表里时走这份
#
# 二、逐集线（没有故事，直接一集一集续写的老路径）—— 剧集页 / 单集页
#   [script_premise]  选题：给几个方向的方案            POST /api/script/premise
#   [script]          逐集写剧本：一句梗概 + 前几集原文  POST /api/script/write
#   [script_trailer]  预告片                             POST /api/script/trailer（「剪一条」）
#   [bible]           从一集剧本里找出角色和场景并定妆   POST /api/bible，没有故事时走这份
#
# 三、剧本之后，两条线共用
#   [storyboard]      把一集剧本拆成分镜表
#                     POST /api/plan、/api/plan/all（「批量补分镜」）
#   [ref_images]      角色三视图 / 场景空景的参考图提示词，喂出图模型
#                     POST /api/character/reference/generate、/api/location/reference/generate
#   [style]           默认画风、默认负向词：项目没填时补上，出图出片每一镜都带
#   [compose]         景别 / 机位 / 运镜的词表，拼进每一镜的首帧和运动提示词
#                     stages/prompt_compose.cpp
#
# 四、所有走 JSON Schema 的大模型请求共用
#   [llm]             贴在提示词末尾、schema 前面的那句话（llm/client.cpp 的 schema_as_prompt）
#
# ---- 格式 ----
#
# TOML 的一个子集（gen_prompts.py 开头列了认哪些东西）：
#   · 三引号 """ 是多行字符串，**开头紧跟的那个换行不算内容**，所以每条
#     从三引号的下一行开始写；结尾的三引号紧贴最后一个字，那个字后面的
#     空格和空行都是内容。好几条段落故意以空格或空行结尾（后面要接数字
#     或下一段），别"顺手清理"。
#   · 数字是截断长度、比例这类和提示词一起调的旋钮，生成成 std::size_t / double。
#   · 字符串数组生成成 const char* 数组。
#   · [compose.*] 那几张二级表是出图提示词里的词表，键是枚举名。
#
# ---- 哪些能随便改、哪些不能 ----
#
#   [bible] [script] [script_premise] [script_trailer] [storyboard] [style] [compose]
#   这几张是从已经删掉的 Python 引擎逐字节搬过来的，tests/golden 里有对拍
#   语料钉着——改一个字对应的单元测试就红，那是有意的（提示词是喂给模型的
#   输入，差一个空格出的东西就不一样）。改了就把语料一起改。
#   其余的表是 C++ 时代新写的，没有对拍语料，该调就调。
#
# 每张表开头的注释说的是这张表拼成一条提示词的顺序，「画风」「时长」这类
# 是运行时插进去的值，[方括号] 里的是有条件才出现的块。


# ==========================================================================
# 一、故事线：先有一部完整的故事，再一集一集拍（故事页）
# ==========================================================================


# 故事大纲的提示词。
#
# 和 [script] / [bible] 那几个不一样：那些是从已经删掉的 Python
# 引擎移植过来的，要求逐字节一致（有对拍语料钉着）。这一份是新写的，
# 没有 Python 对应物，**不受逐字节约束**，该调就调。
#
# 拼接顺序：
#   seg0 + 画风 + seg1 + 章数 + seg2 + rules
#        + [keywords_pre + 关键词 + keywords_post]
#        + tail_head + 梗概 + tail_end（没给梗概时 tail_head + 梗概 换成 no_premise）
[story_outline]

seg0 = "你在给一部竖屏"

hint_realistic = "真人写实短剧"

hint_anime = "动漫短剧"

seg1 = "写故事大纲。整个故事写成 "

seg2 = """
 章左右。

硬性要求：
"""

rules = """
1. 这是一个**有结尾的完整故事**，不是一个能一直往下拍的设定。
   最后一章要把主线了结，不要留「待续」。
2. 章数按故事本身的需要来。上面那个数只是量级，多一两章少一两章都行，
   但不要为了凑数注水，也不要硬收。
3. 每一章只推进一件事。一章里塞三条线，后面按时长切集时切不开。
   但**一章是一个完整的故事单元，不是一句话**：它后面要展开成几千字正文，
   再按每集时长切成好几集。所以 summary 要写清这一章从哪儿开始、中间
   发生什么、到哪儿为止，撑得起这个体量。
   **每一章都要把故事往前挪一步**：换了地方、过了一段时间，或者局面变了。
   下一章从上一章停下的地方接着走，不回头把同一个场面换个角度再演一遍——
   三章都写「门铃响、她拿着伞进来」，等于只写了一章。
4. **每一章都要抖出一件新的事，而且它要推翻前面的认知**（reveal 那一栏）。
   四种里挑一种：谁其实是谁（身份）、两人其实是什么关系、当年那件事其实
   不是大家以为的那样（事实）、他当初那么做其实是为了什么（动机）。
   「又见了一面」「又谈了一次」「他解释了一遍」不算——那是推进，不是反转。
   一章抖一件，后面几章抖的要比前面那件更狠，不能四章都在抖同一件事的
   不同说法。
   **最后一章抖的那件事要能了结主线**，前面几章抖的都是通向它的台阶。
   每一章还要**埋下**一样后面才回收的东西（plant 那一栏）：一个物件、
   一句没头没尾的话、一个当时说不通的细节。埋的时候不解释，读者当时
   看不出它要紧。**最后一章回收前面埋的某一样**——观众要的不是被吓一跳，
   是「原来如此」。凭空冒出来的反转不算数。
5. 每一章的 hook 是**这一章结束时悬着的那件事**：一个悬念、一个反转，
   或者一个明确的情绪落点。后面每一集的结尾都要落在这种位置上，
   所以每章都必须有，不能空着。
   **写成能直接当这一章最后一句的正文**：一句台词、一个动作，或者一样
   被看见的东西。不是向读者提问，不是「他们能否走到一起？」这种梗概腔，
   也不要写「故事完结」「无续集」这类说明——正文那一步会把它照抄进去。
6. 主要人物不超过三个。短剧里人一多就立不住。配角只写真的有戏的。
7. **不要写任何长相、发型、服装、身材。** 人物长什么样由后面的美术那一步
   统一定，这里写了两边必然不一致，而不一致会一路带到每一个镜头上。
   这里只写他是谁、他要什么、他怎么变。
8. 每一组有戏的关系都要写进 relations，并且说清那段关系里绷着的是什么。
   只写「前任」不够，要写成「谁欠谁一句没说出口的道歉」。
9. want 是这个人物**主动要的东西**。没有欲望的人物推不动情节，
   写「希望生活变好」这种等于没写。
10. 地点要具体到看得见：不说「一家咖啡馆」，说「高架桥下那家通宵咖啡馆」。
   后面每一镜都要照着它画，含糊的地方每镜长得都不一样。
11. 人物名前后一模一样，不要一会儿全名一会儿简称。

"""

keywords_pre = "往这个方向想："

keywords_post = """


"""

tail_head = """
这部剧讲的是：

"""

# 没给梗概时走这一段。
#
# **梗概不是必填的。** 三个入口里只有「我自己有个想法」那条是从手写的
# 一句话开始的；「给几个关键词」和「什么都没有，你来一个」同样正当，
# 而把梗概做成硬门槛等于又把人摁回空白框前面发呆。选题本来就是最难
# 从零开始的一步。
no_premise = """
这部剧讲什么**由你定**。先自己想一个选题，再照着它写大纲。
选题要具体到人物和处境，一句话里就得有冲突——「都市复仇爽剧」那种是
题材标签不是选题。把它写进 premise 那一项。

"""

tail_end = """


只输出 JSON，不要任何解释文字。"""

# 塞进提示词前要截断的长度，按**字符**不是字节。
premise_max_chars = 2000

keywords_max_chars = 200

# 模型吐得离谱时的上限。不拦的话一份大纲能撑爆后面每一步的上下文。
max_chapters = 200

max_characters = 60


# 逐章展开正文的提示词。新写的，不受逐字节约束。
#
# 这一步补的是 AI 那条路上最后一个洞：大纲写出来的故事**只有梗概没有正文**，
# 写剧本时展开的是「这一章发生什么，三五句」，而不是真正的内容。
#
# ---- 2026-09-12 重写：从「一堆段落」改成「几场戏」----
#
# 上一版的产物用户的判词是「只能叫剧本不能叫故事/小说」。实测那一章
# （chapter_check8 / ch02，1674 字）把重逢、决裂、离开、回来、和好五件事
# 全写完了，每一段推进一整个事件——叙事学上这叫**概述**（叙述时长远短于
# 故事时间）。小说读起来是小说靠的是**场景**：叙述时长约等于故事时间，
# 一个动作一段、一句对白一段。
#
# 上一版的三条规则直接造出了这个结果：
#   · schema 里写着「一段一两句话、三四十个字」+ 段数 = 字数/35
#     → 数学上就规定了每段 35 字的字幕体；
#   · 「不要写替读者解释心理和意义的旁白」→ 模型理解成「不许写内心」，
#     于是只剩「神情复杂」「心中涌起难以言喻的情绪」这类情绪标签；
#   · 「不要描写长相、发型、服装」→ 扩大成「不要描写人」，人物在场上没有身体。
# 而提示词里从头到尾没有「场」这个单位，模型拿到整章梗概只能平摊。
#
# 现在：一章 = 几场戏，一场 = 一个地方一段时间里，谁想干什么、谁拦着、
# 最后局面变成什么（turn）。turn 就是那一集的收口——**分集从此按场切，
# 不再靠模型抄一句原文回来定位**。
#
# 拼接顺序：seg0 + 画风 + seg1 + 场数 + seg1b + 每场字数 + seg2 + rules
#           + [first_head，第一章才有] + context_head + 上下文 + tail
#
# ⚠️ 第 7 条（不靠眼睛的细节）的下限 2026-09-12 从「至少一个」提到「三四处」，
# **那一轮的对照是无效的，别拿它当依据**：改提示词的同一天，机器上的模型
# 也从 Qwen3-14B 换成了 32B（配置 14:52 改的，对照的两跑一个在 14:27、
# 一个在 15:03）。两个变量混在一起，「提上去之后数没动」这个结论不成立。
# 要重做的话，先把模型钉住再改措辞。
[chapter_write]

seg0 = "你在写一部竖屏"

hint_realistic = "真人写实短剧"

hint_anime = "动漫短剧"

seg1 = """
的原作小说，现在写其中**一章**的正文。

这一章写成 """

# 场数和每场字数之间。
seg1b = " 场戏，每一场 "

seg2 = """
 字上下。

**一场戏是**：一个地方、一段连着的时间里，某个人想做成一件事，有人或者
有什么拦着，到最后局面变了。场与场之间隔多久都行，隔着的那段时间用一两句
带过去。

**主要产出是正文**——每一场的 paragraphs 里一段一项，是读者一句句读下去的
小说，不是梗概，也不是分镜。

硬性要求：
"""

rules = """

**一、写场面，不写概述。这一条是全部里最要紧的。**
1. 一段推进的是**一两秒钟的事**：一个动作、一句话、一次看见、一个念头。
   一段吃掉一整件事（谁转身走了、谁想通了、两人和好了），那是梗概不是正文。
2. 下面【这一章】里写的事不止一件。**挑最要紧的几件，一件一场，实时地写**；
   剩下的用一两句话推过去。不要一件事一段，把整章摊成一串镜头。
   **一场的字数是靠对白往返和感官细节撑起来的，不是靠多塞几件事。**
   写短了就回去把那场戏演完整：他说了这句，对方怎么接；她伸手之前先看了
   哪儿；屋里什么声音、什么味道。多塞事件只会又变回概述。
3. 每一场开头先落地：在哪、什么时候、什么光、谁在场、手上正在做什么。
4. 一场里的时间是连着的。中间要跳过半小时，那就是下一场了。

**二、一场只跟着一个人走。**
5. pov 那个人心里想什么可以写；**别人心里想什么一个字都不能写**，
   只能从外面看见——他做了什么、说了什么、脸转向哪儿。一场里进两个人的
   脑子，读者立刻出戏。
6. 内心不要写成情绪的名字，写成身体，和他此刻真在想的那件具体的事。
   下面这些词一个都不要用：神情复杂、五味杂陈、百感交集、难以言喻、
   若有所思、不知所措、心中涌起、内心充满、眼中满是、久久不能平静、
   意味深长。它们替读者把感受做完了，读者就没什么可感受的。

**三、看得见、听得见、摸得着。**
7. **不靠眼睛的细节，一场里要有三四处，散在不同的段落里**：一个声音、
   一股味道、一个温度、一下触感、手上的一点疼。全是视觉的场面是空的，
   而只在开头写一句味道、后面再不提，读者早就忘了自己在哪儿。
   悬疑这类叙述克制的题材尤其吃这个——它靠的是把细小的具体事情一件件
   摆出来，让读者自己发毛，不是靠谁说了什么。
8. 东西要具体到看得见：不说「一件信物」，说「一枚缺了角的铜钱」。
   地方也一样，写出这一处独有的那样东西。
9. 别堆形容词。一个准确的名词加一个准确的动词，顶十个形容词。
10. **不要写长相、发型、服装的款式和颜色**——人物长什么样由后面的美术那
   一步统一定，这里写了两边必然对不上。
   但**身体要在场上**：手在干什么、隔多远、声音哑不哑、衣服湿没湿、
   坐着还是站起来了。这一条不是让你别写人，是别定他长什么样。

**四、对白。**
11. 对白用 “” 双引号，谁说的和说了什么放在同一段。
    **说话的人要有名字**，就是人物表里那个名字。不要写成「那边传来熟悉的
    声音」「有人说」——读者认不出是谁在说话，后面写剧本那一步也认不出，
    那句台词会变成没有主人的旁白。
12. 不要每一句都「某某说」。用动作把话带出来：他先做了个什么动作，再开口。
13. 话里要留东西。人不会把心里的事说全——答非所问、说半句、扯到别处，
   都比说破了更像真人。**留的是什么，看下面人物表里「他怕的是」那一条**：
   一个人躲开的、含糊过去的、突然翻脸的地方，都是被那件事戳到了。
14. 一来一往地写。连着好几段只有一个人在说，画面就停住了。

**五、只写这一章。**
15. 后面几章的事一个字都不要提前写。前情提要里的事都已经发生过，不重演。
16. 从上一章停下的地方接着走。
   人物表里写了每个人「会从什么变成什么」。**那个变化要写成行为**：同一种
   处境下，他这一次的选择和上一次相反。不要让谁开口说自己变了。
17. **下面【地方】那一份是整个故事的清单，不是这一章的。** 这一章用得着
   哪一两个地方，就只写那一两个——一章里的几场戏本来就该发生在同一个地方
   或者隔壁，跑遍全城的每一个地点，说明是在拿地点凑场数。
18. 人物名和下面给的一字不差，不要冒出没在人物表里的人。
   **不要写镜头**。「镜头拉远」「画面切到」「特写」这些是分镜的话，
   不是小说的话——后面另有一步把正文变成拍子，那一步认的是连贯的正文。
19. 同一句话、同一个动作，一章里不要出现第二次。
20. **每一场都要有人说话，一场也不能少。** 一个人从头想到尾、一句对白
   都没有的场，切出来就是一集默片。场上只有一个人的时候，要么让另一个人
   进来，要么把这一场换成有人在的地方——回忆不是戏。
21. **两场不能停在同一件事上。** 每一场的 turn 各是一集的钩子，两集钩子
   撞车，观众看到的是剧情在原地打转。上一章已经停过的地方也不能再停一次。

**六、每一场停在它的 turn 上。**
22. turn 是这一场结束时**局面变成了什么**，而且要悬着：一个新麻烦、
