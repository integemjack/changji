# global_style），够用；真要再压一道，项目页那个「负向」框就是干这个的，
# 而且写在那儿用户看得见。
negative_base = "低质量，模糊，过曝，畸形，多余的手指，画得不好的手部，画得不好的脸部，静止不动的画面，字幕，水印"

# 视频模型的负向词，和上面那份图像的分开：「多余的手指」对出片模型没意义，
