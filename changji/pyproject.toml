[project]
name = "changji"
version = "0.1.0"
description = "AI 短剧生产流水线：剧本到成片的本地编排引擎"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "websockets>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "platformdirs>=4.3",
    "tomlkit>=0.13",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
changji = "changji.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/changji"]
artifacts = ["src/changji/workflows/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: 全流程测试，需要真实的 ComfyUI 和 ffmpeg，跑得慢",
]
