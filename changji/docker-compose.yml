# 一条命令拉起全套：Web 平台、编排引擎、ComfyUI、大模型服务。
#
#   docker compose up -d
#
# 然后打开 http://localhost:5174
name: changji

services:
  # 引导式 Web 平台。Node 发前端 + 转发接口，不做推理，不需要显卡。
  # 引擎地址填错时界面仍然打得开，就是因为它单独在这一层，
  # 前端直连引擎的话，地址一填错就等于把自己锁在门外。
  webapp:
    build: ./webapp
    image: changji/webapp:latest
    container_name: changji-webapp
    ports:
      - "${WEBAPP_PORT:-5174}:5174"
    volumes:
      # 引擎地址和投递目标写在这里，不挂出来容器一重建就没了
      - ${CHANGJI_WEBAPP_CONFIG:-./data/webapp}:/data/webapp
      # 上传那一步要把成片投递到这里，宿主机上接手的脚本从这儿取
      - ${CHANGJI_PUBLISH:-./data/publish}:/data/publish
    environment:
      - CHANGJI_ENGINE_URL=http://changji:8080
    depends_on:
      changji:
        condition: service_healthy
    restart: unless-stopped


  # 编排引擎与 Web 界面。不做推理，不需要显卡。
  changji:
    # **迁移期间两份都在。** 默认还是 Python 那版；要换成 C++ 引擎，
    # 在 .env 里写这两行（镜像 tag 一起换，免得两版覆盖同一个 tag，
    # 回滚时分不清手上是哪一个）：
    #
    #     CHANGJI_DOCKERFILE=Dockerfile.cpp
    #     CHANGJI_IMAGE=changji/changji:cpp
    #
    # 做成一个变量而不是另起一个 service，是因为 webapp 的 depends_on 指着
    # 这个名字——另起一个的话那条依赖要跟着分叉，两边都得维护。
    build:
      context: .
      dockerfile: ${CHANGJI_DOCKERFILE:-Dockerfile}
    image: ${CHANGJI_IMAGE:-changji/changji:latest}
    container_name: changji
    ports:
      - "${CHANGJI_PORT:-8080}:8080"
    volumes:
      # 项目数据。这是唯一需要备份和迁移的目录。
      - ${CHANGJI_PROJECTS:-./data/projects}:/data/projects
      # 界面上改的连接设置写在这里。不挂出来的话容器一重建就没了，
      # 用户会以为「保存」这个按钮是假的。
      - ${CHANGJI_CONFIG:-./data/config}:/root/.config/changji
    environment:
      # SEED 开头的只在首次启动播种进配置文件，之后界面上改的说了算。
      # 用环境变量常驻会永久盖住界面改的值，那样「保存」就是假的。
      - CHANGJI_SEED_COMFY_URL=http://comfyui:8188
      # 默认连本 compose 起的 ollama。本机已经在跑 Ollama 的话，
      # 在 .env 里设 CHANGJI_LLM_URL=http://host.docker.internal:11434/v1
      - CHANGJI_SEED_LLM_URL=${CHANGJI_LLM_URL:-http://ollama:11434/v1}
      - CHANGJI_SEED_LLM_MODEL=${CHANGJI_LLM_MODEL:-qwen3:14b}
      # ComfyUI 在另一个容器里，本机探测不到显卡，手动告知显存
      - CHANGJI_SEED_VRAM_GB=${CHANGJI_VRAM_GB:-16}
      # 项目库位置由挂载决定，不是给用户在界面上改的，所以仍用环境变量
      - CHANGJI_WORKSPACE=/data/projects
    depends_on:
      comfyui:
        condition: service_healthy
    restart: unless-stopped

  # 推理服务。需要显卡。
  comfyui:
    image: ${COMFYUI_IMAGE:-changji/comfyui:cu130}
    build:
      context: ./docker/comfyui
    container_name: changji-comfyui
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    volumes:
      # 模型跟机器走不跟项目走，所以单独一个卷。
      # 配音模型权重也落在这里面，十几 GB，绝不能跟着容器丢。
      # 已经下好模型的机器把 COMFYUI_MODELS 指过去，避免重下十几 GB
      - ${COMFYUI_MODELS:-./data/comfyui/models}:/app/ComfyUI/models
      # 注意这里挂的是 custom_nodes 下的子目录，不是整个目录。
      # 挂载会覆盖镜像内容，整个挂会把镜像里烤好的配音节点包盖掉。
      - ./data/comfyui/custom_nodes:/app/ComfyUI/custom_nodes/user
      - ./data/comfyui/output:/app/ComfyUI/output
      - ./data/comfyui/input:/app/ComfyUI/input
      - ./data/comfyui/user:/app/ComfyUI/user
    environment:
      # 国内直连 HuggingFace 下大文件会传到一半断流。实测下 Qwen3-TTS
      # 的 12GB 权重时卡在 2.7GB 不动，留下 .incomplete 文件。
      # 走镜像站更稳。huggingface_hub 能正确处理它的跳转，
      # 早先用 curl 时因为跳转问题放弃过，那是 curl 的局限不是镜像站的。
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8188/system_stats"]
      interval: 20s
      timeout: 5s
      start_period: 180s
      retries: 20
    restart: unless-stopped

  # 剧本与分镜用的大模型。
  # 本机已有 Ollama 就不用起它，需要时加 --profile llm 启动。
  ollama:
    profiles: [llm]
    image: ollama/ollama:latest
    container_name: changji-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
