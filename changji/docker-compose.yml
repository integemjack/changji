# 一条命令拉起全套：Web 平台、引擎、大模型服务。
#
#   docker compose up -d
#
# 然后打开 http://localhost:5174
#
# **ComfyUI 那个服务 2026-09-10 拆了。** 出图出片现在走引擎进程内的
# sd.cpp，没有第二个推理服务要起。老的 COMFYUI_* 变量留在 .env 里
# 不起作用，可以删掉。
name: changji

services:
  # 引导式 Web 平台。Node 发前端 + 转发接口，不做推理，不需要显卡。
  # 引擎地址填错时界面仍然打得开，就是因为它单独在这一层，
  # 前端直连引擎的话，地址一填错就等于把自己锁在门外。
  webapp:
    build: ./webapp
    image: changji/webapp:latest
    container_name: changji-webapp
    ports:
      - "${WEBAPP_PORT:-5174}:5174"
    volumes:
      # 引擎地址和投递目标写在这里，不挂出来容器一重建就没了
      - ${CHANGJI_WEBAPP_CONFIG:-./data/webapp}:/data/webapp
      # 上传那一步要把成片投递到这里，宿主机上接手的脚本从这儿取
      - ${CHANGJI_PUBLISH:-./data/publish}:/data/publish
    environment:
      - CHANGJI_ENGINE_URL=http://changji:8080
    depends_on:
      changji:
        condition: service_healthy
    restart: unless-stopped


  # 引擎。接口、编排、推理全在这一个进程里。
  # 镜像编的是 CPU 后端，显卡的事留给宿主机上直接跑的那个二进制。
  changji:
    # 阶段 8 之前这里有个 CHANGJI_DOCKERFILE 开关，用来在 Python 和 C++
    # 两份引擎之间切。Python 那份删了，开关跟着没了。
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CHANGJI_IMAGE:-changji/changji:latest}
    container_name: changji
    ports:
      - "${CHANGJI_PORT:-8080}:8080"
    volumes:
      # 项目数据。这是唯一需要备份和迁移的目录。
      - ${CHANGJI_PROJECTS:-./data/projects}:/data/projects
      # 界面上改的连接设置写在这里。不挂出来的话容器一重建就没了，
      # 用户会以为「保存」这个按钮是假的。
      - ${CHANGJI_CONFIG:-./data/config}:/root/.config/changji
    environment:
      # SEED 开头的只在首次启动播种进配置文件，之后界面上改的说了算。
      # 用环境变量常驻会永久盖住界面改的值，那样「保存」就是假的。
      #
      # 默认连本 compose 起的 ollama。本机已经在跑 Ollama 的话，
      # 在 .env 里设 CHANGJI_LLM_URL=http://host.docker.internal:11434/v1
      - CHANGJI_SEED_LLM_URL=${CHANGJI_LLM_URL:-http://ollama:11434/v1}
      - CHANGJI_SEED_LLM_MODEL=${CHANGJI_LLM_MODEL:-qwen3:14b}
      # 容器里探测不到显卡，手动告知显存
      - CHANGJI_SEED_VRAM_GB=${CHANGJI_VRAM_GB:-16}
      # 项目库位置由挂载决定，不是给用户在界面上改的，所以仍用环境变量
      - CHANGJI_WORKSPACE=/data/projects
    restart: unless-stopped

  # 剧本与分镜用的大模型。
  # 本机已有 Ollama 就不用起它，需要时加 --profile llm 启动。
  ollama:
    profiles: [llm]
    image: ollama/ollama:latest
    container_name: changji-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
